<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hologram Orb</title>
<style>
  :root { --bg:#000; --cyan:#35e8ff; --dim:#0e5560; --warn:#ff4fd8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); overflow:hidden; font-family:"Segoe UI",system-ui,sans-serif; color:var(--cyan); }
  canvas#scene { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #cam { position:fixed; right:16px; bottom:16px; width:240px; aspect-ratio:4/3; border:1px solid var(--dim);
         clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px)); background:#020a0c; }
  #cam video, #cam canvas { position:absolute; inset:0; width:100%; height:100%; transform:scaleX(-1); object-fit:cover; }
  #cam video { opacity:.35; }
  #hud { position:fixed; left:20px; top:18px; font-size:14px; line-height:1.7; text-shadow:0 0 8px var(--cyan); pointer-events:none; }
  #hud b { font-weight:600; }
  #status { color:#fff; }
  #guide { position:fixed; left:20px; bottom:18px; font-size:13px; line-height:1.8; color:#7fdbe6; opacity:.8; pointer-events:none; }
  #start { position:fixed; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.88); z-index:5; text-align:center; }
  #start button { font:inherit; font-size:18px; padding:14px 34px; color:var(--cyan); background:transparent; border:1px solid var(--cyan);
                  cursor:pointer; clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
                  transition:background .15s, color .15s; }
  #start button:hover, #start button:focus-visible { background:var(--cyan); color:#000; outline:none; }
  #start p { margin-top:16px; color:#7fdbe6; font-size:14px; }
  #err { color:var(--warn); margin-top:14px; max-width:420px; }
  @media (max-width:640px){ #cam{width:150px} #guide{display:none} }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="cam"><video id="video" playsinline muted></video><canvas id="lm"></canvas></div>

<div id="hud">
  <div><b>Hologram orb</b></div>
  <div>Status: <span id="status">waiting</span></div>
  <div>Hands: <span id="hands">0</span></div>
</div>

<div id="guide">
  Pinch: grab and move the orb<br>
  Two hands pinching: pull apart to scale<br>
  Open hand swipe: spin it<br>
  Fist: collapse to core<br>
  F fullscreen · H hide camera
</div>

<div id="start">
  <div>
    <button id="go">Start camera</button>
    <p>Everything runs locally. Video never leaves your computer.</p>
    <p id="err"></p>
  </div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

/* ---------- Scene ---------- */
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
camera.position.z = 6;

const orb = new THREE.Group();
scene.add(orb);

const mat = (c, o) => new THREE.MeshBasicMaterial({ color:c, wireframe:true, transparent:true, opacity:o, blending:THREE.AdditiveBlending, depthWrite:false });
const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 3), mat(0x35e8ff, .35));
const inner = new THREE.Mesh(new THREE.IcosahedronGeometry(.62, 1), mat(0x35e8ff, .55));
const core  = new THREE.Mesh(new THREE.SphereGeometry(.16, 24, 24),
  new THREE.MeshBasicMaterial({ color:0xbaf8ff, transparent:true, opacity:.9, blending:THREE.AdditiveBlending }));
orb.add(shell, inner, core);

// particle haze
const N = 700, pos = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  const r = 1.05 + Math.random() * .5, t = Math.random() * 6.283, p = Math.acos(2 * Math.random() - 1);
  pos.set([r*Math.sin(p)*Math.cos(t), r*Math.sin(p)*Math.sin(t), r*Math.cos(p)], i * 3);
}
const pg = new THREE.BufferGeometry(); pg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
const points = new THREE.Points(pg, new THREE.PointsMaterial({ color:0x7ff3ff, size:.025, transparent:true, opacity:.8, blending:THREE.AdditiveBlending, depthWrite:false }));
orb.add(points);

// orbit rings
const rings = [0, 1, 2].map(i => {
  const m = new THREE.Mesh(new THREE.TorusGeometry(1.35 + i * .12, .004, 8, 160),
    new THREE.MeshBasicMaterial({ color:0x35e8ff, transparent:true, opacity:.55, blending:THREE.AdditiveBlending }));
  m.rotation.set(Math.random() * 3, Math.random() * 3, 0);
  orb.add(m); return m;
});

// floor grid for hologram feel
const grid = new THREE.GridHelper(14, 28, 0x0e5560, 0x06252b);
grid.position.y = -2.6; grid.material.transparent = true; grid.material.opacity = .5;
scene.add(grid);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

/* ---------- State ---------- */
const state = {
  pos: new THREE.Vector3(0, 0, 0), targetPos: new THREE.Vector3(0, 0, 0),
  scale: 1, targetScale: 1,
  spin: new THREE.Vector2(.003, .006),
  collapse: 0, targetCollapse: 0,
  color: new THREE.Color(0x35e8ff), targetColor: new THREE.Color(0x35e8ff),
  lastPalm: null
};
const CYAN = new THREE.Color(0x35e8ff), PINK = new THREE.Color(0xff4fd8), GOLD = new THREE.Color(0xffd35a);

const halfH = () => 6 * Math.tan(THREE.MathUtils.degToRad(25));
function toWorld(nx, ny) { // mirrored webcam coords -> world at z=0
  const h = halfH(), w = h * camera.aspect;
  return new THREE.Vector3((0.5 - nx) * 2 * w, -(ny - 0.5) * 2 * h, 0);
}

/* ---------- Gesture helpers ---------- */
const d2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function analyse(lm) {
  const size = d2(lm[0], lm[9]) || 0.1;
  const pinchRatio = d2(lm[4], lm[8]) / size;
  const pinching = pinchRatio < 0.38;
  const folded = [[8,6],[12,10],[16,14],[20,18]].filter(([t, p]) => d2(lm[t], lm[0]) < d2(lm[p], lm[0])).length;
  const fist = folded >= 4 && !pinching;
  const pinchPt = { x:(lm[4].x + lm[8].x) / 2, y:(lm[4].y + lm[8].y) / 2 };
  const palm = { x:(lm[0].x + lm[5].x + lm[17].x) / 3, y:(lm[0].y + lm[5].y + lm[17].y) / 3 };
  return { pinching, fist, pinchPt, palm };
}

/* ---------- Camera + tracking ---------- */
const video = document.getElementById("video");
const lmCanvas = document.getElementById("lm"), lctx = lmCanvas.getContext("2d");
const statusEl = document.getElementById("status"), handsEl = document.getElementById("hands");
let landmarker = null, running = false, lastVideoTime = -1;

const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHands(all) {
  lmCanvas.width = video.videoWidth || 640; lmCanvas.height = video.videoHeight || 480;
  lctx.clearRect(0, 0, lmCanvas.width, lmCanvas.height);
  lctx.strokeStyle = "#35e8ff"; lctx.fillStyle = "#fff"; lctx.lineWidth = 2;
  for (const lm of all) {
    for (const [a, b] of CONN) { lctx.beginPath(); lctx.moveTo(lm[a].x * lmCanvas.width, lm[a].y * lmCanvas.height); lctx.lineTo(lm[b].x * lmCanvas.width, lm[b].y * lmCanvas.height); lctx.stroke(); }
    for (const p of lm) { lctx.beginPath(); lctx.arc(p.x * lmCanvas.width, p.y * lmCanvas.height, 2.5, 0, 6.283); lctx.fill(); }
  }
}

function processHands(all) {
  handsEl.textContent = all.length;
  const hs = all.map(analyse);
  state.targetColor.copy(CYAN);
  state.targetCollapse = 0;

  if (hs.length === 2 && hs[0].pinching && hs[1].pinching) {
    const a = toWorld(hs[0].pinchPt.x, hs[0].pinchPt.y), b = toWorld(hs[1].pinchPt.x, hs[1].pinchPt.y);
    state.targetPos.copy(a).add(b).multiplyScalar(.5);
    state.targetScale = THREE.MathUtils.clamp(a.distanceTo(b) / 2.2, .35, 3.2);
    state.targetColor.copy(GOLD); statusEl.textContent = "scaling"; state.lastPalm = null;
  } else if (hs.some(h => h.pinching)) {
    const h = hs.find(h => h.pinching);
    state.targetPos.copy(toWorld(h.pinchPt.x, h.pinchPt.y));
    state.targetColor.copy(GOLD); statusEl.textContent = "grabbed"; state.lastPalm = null;
  } else if (hs.some(h => h.fist)) {
    state.targetCollapse = 1; state.targetColor.copy(PINK); statusEl.textContent = "core mode"; state.lastPalm = null;
  } else {
    const h = hs[0];
    if (state.lastPalm) {
      state.spin.y += (h.palm.x - state.lastPalm.x) * -0.9;
      state.spin.x += (h.palm.y - state.lastPalm.y) * 0.9;
    }
    state.lastPalm = h.palm; statusEl.textContent = "spinning";
  }
}

async function loop() {
  if (!running) return;
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    if (res.landmarks.length) { drawHands(res.landmarks); processHands(res.landmarks); }
    else { lctx.clearRect(0, 0, lmCanvas.width, lmCanvas.height); handsEl.textContent = 0; statusEl.textContent = "idle"; state.lastPalm = null; }
  }
  requestAnimationFrame(loop);
}

/* ---------- Render loop ---------- */
const clock = new THREE.Clock();
function render() {
  const t = clock.getElapsedTime();
  state.pos.lerp(state.targetPos, .18);
  state.scale += (state.targetScale - state.scale) * .15;
  state.collapse += (state.targetCollapse - state.collapse) * .12;
  state.color.lerp(state.targetColor, .12);

  const s = state.scale * (1 - state.collapse * .55) * (1 + Math.sin(t * 2) * .015);
  orb.position.copy(state.pos); orb.scale.setScalar(s);
  orb.rotation.x += state.spin.x; orb.rotation.y += state.spin.y;
  state.spin.multiplyScalar(.96);
  if (Math.abs(state.spin.y) < .004) state.spin.y += (.006 - state.spin.y) * .02; // idle drift

  shell.material.color.copy(state.color); inner.material.color.copy(state.color);
  points.material.color.copy(state.color);
  rings.forEach((r, i) => { r.material.color.copy(state.color); r.rotation.z += .004 * (i + 1); r.visible = state.collapse < .5; });
  inner.rotation.y -= .01; core.scale.setScalar(1 + state.collapse * 1.6 + Math.sin(t * 5) * .08);
  points.material.opacity = .8 - state.collapse * .5;

  renderer.render(scene, camera);
  requestAnimationFrame(render);
}
render();

/* ---------- Start ---------- */
document.getElementById("go").addEventListener("click", async () => {
  const err = document.getElementById("err"); err.textContent = "";
  try {
    statusEl.textContent = "loading model";
    const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate:"GPU" },
      runningMode:"VIDEO", numHands:2
    });
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ width:640, height:480, facingMode:"user" }, audio:false });
    video.srcObject = stream; await video.play();
    document.getElementById("start").style.display = "none";
    running = true; statusEl.textContent = "idle"; loop();
  } catch (e) {
    err.textContent = "Could not start: " + (e.message || e) + ". Check camera permission and internet (the model loads from a CDN once).";
    statusEl.textContent = "error";
  }
});

addEventListener("keydown", e => {
  if (e.key === "f" || e.key === "F") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (e.key === "h" || e.key === "H") { const c = document.getElementById("cam"); c.style.display = c.style.display === "none" ? "" : "none"; }
});
</script>
</body>
</html>
